services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eurisko-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://api:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eurisko-api
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://dev:devpassword@postgres:5432/trading_platform
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - qdrant

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: trading_platform
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: eurisko-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  adminer:
    image: adminer
    container_name: eurisko-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
  qdrant_data:
